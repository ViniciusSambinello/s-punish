name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build shaded jars
        run: ./gradlew :spunish-paper:shadowJar :spunish-velocity:shadowJar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            spunish-paper/build/libs/spunish-paper-*.jar
            spunish-velocity/build/libs/spunish-velocity-*.jar
          generate_release_notes: true
